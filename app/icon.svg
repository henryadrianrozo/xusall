<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="XUsAll">
  <!-- Favicon. There is no logomark in the brand; this is the same X-gradient
       treatment used on the wordmark in the hero, at the one size where a
       single glyph has to carry the whole mark. Colors match the spectrum
       tokens in app/globals.css; keep them in sync if the palette moves. -->
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <defs>
    <linearGradient id="xg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="20%" stop-color="#FF9F43"/>
      <stop offset="40%" stop-color="#FFD93D"/>
      <stop offset="60%" stop-color="#4ADE80"/>
      <stop offset="80%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <path d="M17 16 L47 48 M47 16 L17 48" stroke="url(#xg)" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
